<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inspection image analysis</title>
<style>
:root{--bg:#f4f5f7;--ink:#1a2230;--mut:#5c6675;--line:#d5d9e0;--acc:#0f5c8a;--card:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#12161d;--ink:#e8ecf2;--mut:#9aa5b5;--line:#2c3441;--acc:#5db3e6;--card:#1a2029}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Segoe UI",system-ui,sans-serif}
main{max-width:1000px;margin:0 auto;padding:32px 20px}
h1{font:600 26px/1.2 Georgia,serif;margin:0 0 4px}
p.sub{color:var(--mut);margin:0 0 24px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:end;margin-bottom:20px}
label{display:block;font-size:14px;color:var(--mut);margin-bottom:4px}
input[type=file],input[type=number]{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px}
button{background:var(--acc);color:#fff;border:0;border-radius:6px;padding:10px 20px;font:inherit;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.grid{display:grid;grid-template-columns:2fr 1fr;gap:20px}
@media(max-width:760px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px}
img{max-width:100%;border-radius:4px;display:block}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line)}
#msg{color:var(--mut);margin:0 0 12px;min-height:1.5em}
</style>
</head>
<body>
<main>
<h1>Inspection image analysis</h1>
<p class="sub">Upload an inspection photo. The model marks what it detects and how confident it is. A person still reviews every result.</p>
<div class="row">
  <div><label for="f">Image (JPG or PNG)</label><input id="f" type="file" accept="image/*"></div>
  <div><label for="c">Minimum confidence</label><input id="c" type="number" min="0.05" max="0.95" step="0.05" value="0.25"></div>
  <button id="go" type="button">Analyse image</button>
</div>
<p id="msg" role="status">Choose an image to begin.</p>
<div class="grid" id="out" hidden>
  <div class="card"><img id="res" alt="Image with detected objects outlined"></div>
  <div class="card"><table><thead><tr><th>Class</th><th>Confidence</th></tr></thead><tbody id="rows"></tbody></table></div>
</div>
</main>
<script>
const $=id=>document.getElementById(id);
$("go").onclick=async()=>{
  const file=$("f").files[0];
  if(!file){$("msg").textContent="Choose an image first.";return;}
  const fd=new FormData();fd.append("image",file);fd.append("conf",$("c").value);
  $("go").disabled=true;$("msg").textContent="Analysing…";
  try{
    const r=await fetch("/detect",{method:"POST",body:fd});const d=await r.json();
    if(!r.ok){$("msg").textContent=d.error;return;}
    $("res").src=d.image;
    $("rows").innerHTML=d.detections.map(x=>`<tr><td>${x.class}</td><td>${x.confidence}</td></tr>`).join("")||"<tr><td colspan=2>No detections at this confidence.</td></tr>";
    $("out").hidden=false;
    $("msg").textContent=`${d.detections.length} detection(s) in ${d.ms} ms.`;
  }catch(e){$("msg").textContent="The server did not respond. Check that app.py is running.";}
  finally{$("go").disabled=false;}
};
</script>
</body>
</html>
